name: Temp Preview Visual QA

# Throwaway workflow for one-off signed-in visual QA of PR #1021's live Vercel Preview
# deployment. Scoped to this disposable branch only so it never collides with ci.yml's own
# triggers (push: [main, master, cursor-dev], pull_request). Deleted along with the branch once
# the QA screenshots are captured.
on:
  push:
    branches: [tmp/preview-visual-qa]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --config=playwright.tmp-preview-qa.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-preview-visual-qa-screenshots
          path: test-results/visual-qa/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-preview-visual-qa-trace
          path: test-results/**
          if-no-files-found: ignore
